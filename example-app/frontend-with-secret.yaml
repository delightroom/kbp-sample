apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: frontend
  name: frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      run: frontend
  template:
    metadata:
      labels:
        run: frontend
    spec:
      containers:
      - image: brendanburns/journal-server:latest
        imagePullPolicy: Always
        name: frontend
        # volumeMounts 에 추가된 부분
        volumeMounts:
        - name: passwd-volume
          readOnly: true
          mountPath: "/etc/redis-passwd"
        resources:
          requests:
            cpu: "1.0"
            memory: "1G"
          limits:
            cpu: "1.0"
            memory: "1G"
      # 책 내용과 다르게 추가된 부분
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      # spec.volume 이 적용된 부분
      volumes:
        - name: passwd-volume
          secret:
            secretName: redis-passwd
