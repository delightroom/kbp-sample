apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    run: frontend
  name: frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      run: frontend
  template:
    metadata:
      labels:
        run: frontend
    spec:
      containers:
      - image: brendanburns/journal-server:latest
        imagePullPolicy: Always
        name: frontend
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        resources:
          requests:
            cpu: "1.0"
            memory: "1G"
          limits:
            cpu: "1.0"
            memory: "1G"
        env:
        - name: JOURNAL_ENTRIES
          valueFrom:
            configMapKeyRef:
              # 버전 번호를 넣는것이 좋다
              name: frontend-config
              key: journalEntries
      dnsPolicy: ClusterFirst
      restartPolicy: Always
