# Default values for frontend chart.
# This is a YAML-formatted file.
# Declare variables to be substituted into your templates.

replicaCount: 2

image:
  repository: brendanburns/journal-server
  pullPolicy: Always
  tag: "latest"

resources:
  requests:
    cpu: "1.0"
    memory: "1G"
  limits:
    cpu: "1.0"
    memory: "1G"

# ConfigMap configuration
config:
  journalEntries: "default-entries"

# Secret configuration
secret:
  name: redis-passwd

service:
  type: ClusterIP
  port: 80

nameOverride: ""
fullnameOverride: "" 